# Omarchy shell surfaces matching user screenshot

[bar]
background       = "#1E1E2E"
background-alpha = 0.92
text             = "#CDD6F4"
active           = "#CBA6F7"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28

[hyprland]
active-border            = "#BFA7DB #C18FB1 90deg"
active-border-foreground = "#CDD6F4"

[controls]
normal-color        = "#CDD6F4"
normal-fill-alpha   = 0.06
normal-border       = "#313244"
normal-border-width = 1
normal-border-alpha = 0.6

hover-cursor-color        = "#FFFFFF"
hover-cursor-fill-alpha   = 0.14
hover-cursor-border       = "#CBA6F7"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.7

focus-color        = "#FFFFFF"
focus-fill-alpha   = 0.14
focus-border       = "#CBA6F7"
focus-border-width = 1
focus-border-alpha = 0.9

selected-color        = "#FFFFFF"
selected-fill-alpha   = 0.25
selected-border       = "#CBA6F7"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.28
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background       = "#1E1E2E"
background-alpha = 0.94
text             = "#CDD6F4"
border           = "hyprland.active-border"
border-alpha     = 1.0

[tooltip]
background       = "#181825"
background-alpha = 0.97
text             = "#CDD6F4"
border           = "hyprland.active-border-foreground"
border-alpha     = 1.0

[notifications]
background       = "#1E1E2E"
background-alpha = 0.95
text             = "#CDD6F4"
border           = "hyprland.active-border"
border-alpha     = 1.0
countdown        = "#CBA6F7"

[launcher]
background                = "#1E1E2E"
background-alpha          = 0.90
text                      = "#CDD6F4"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#11111B"
scrim-alpha               = 0.55
selected-background       = "#45475A"
selected-background-alpha = 0.8
selected-text             = "#CDD6F4"
selected-border           = "hyprland.active-border-foreground"
selected-border-alpha     = 0.5

[menu]
background                = "#1E1E2E"
background-alpha          = 0.92
text                      = "#CDD6F4"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#11111B"
scrim-alpha               = 0.55
selected-background       = "#45475A"
selected-background-alpha = 0.8
selected-text             = "#CDD6F4"
selected-border           = "hyprland.active-border-foreground"
selected-border-alpha     = 0.5

[polkit]
background       = "#1E1E2E"
background-alpha = 1.0
text             = "#CDD6F4"
text-error       = "#F38BA8"
border           = "hyprland.active-border"
border-error     = "#F38BA8"
border-alpha     = 1.0
scrim            = "#11111B"
scrim-alpha      = 0.55
accent           = "#CBA6F7"

[lock]
background       = "#1E1E2E"
background-alpha = 0.88
text             = "#CDD6F4"
placeholder      = "#7F849C"
text-error       = "#F38BA8"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#F38BA8"
border-alpha     = 1.0
selection        = "#CBA6F7"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#11111B"
scrim-alpha             = 0.55
text                    = "#CDD6F4"
selected-border         = "#CBA6F7"
selected-border-alpha   = 1.0
unselected-border       = "#313244"
unselected-border-alpha = 0.5
